[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-runtime"
version = "0.1.0"
description = "RICE local single-process runtime (배포물 ②) — agent + learning loop + connectors"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
  # web/runtime surface (server layer). The agent core + walking skeleton run on
  # the stdlib alone; these are needed to actually serve the local API.
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real providers + connector deps are opt-in so the skeleton stays light.
claude = ["anthropic>=0.40"]
connectors = ["keyring>=24", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]  # httpx → FastAPI TestClient

[project.scripts]
rice-runtime = "rice_runtime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rice_runtime = ["core/storage/migrations/*.sql", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
