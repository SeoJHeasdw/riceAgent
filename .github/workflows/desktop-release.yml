name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            package_script: package:mac
          - name: macOS x64
            runner: macos-15-intel
            package_script: package:mac
          - name: Windows x64
            runner: windows-2025
            package_script: package:win
          - name: Windows arm64
            runner: windows-11-arm
            package_script: package:win
          - name: Linux x64
            runner: ubuntu-24.04
            package_script: package:linux
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            package_script: package:linux

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rice-app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rice-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: rice-runtime/packaging/requirements-bundle.txt

      - run: npm ci
      - run: npm run ${{ matrix.package_script }}
        env:
          # electron-builder uses these automatically when repository secrets
          # are configured; unsigned artifacts are still produced without them.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v4
        with:
          name: rice-${{ runner.os }}-${{ runner.arch }}
          path: rice-app/release/**/*
          if-no-files-found: error
          retention-days: 14
