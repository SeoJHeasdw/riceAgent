appId: com.rice.app
productName: RICE
copyright: Copyright © 2024 RICE Team

directories:
  output: release/${version}
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/**/*

# Native PyInstaller bundle prepared on the same OS/architecture as Electron.
# Installed users do not need Python; the interpreter and site-packages live in
# <resources>/rice-runtime.
extraResources:
  - from: runtime-dist/${platform}-${arch}/rice-runtime
    to: rice-runtime
    filter:
      - "**/*"

# macOS configuration
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

dmg:
  title: ${productName} ${version}
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

# Windows configuration
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}

# Linux configuration
linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}
  synopsis: Runtime-Integrated Conversational Environment
  description: RICE is a desktop application for interacting with AI agents powered by MCP tools and plugins.
  maintainer: RICE Team

# Publishing is intentionally opt-in. CI uploads build artifacts without
# pretending that example.com is a real update endpoint.
publish: null

# Compression
compression: normal

# Electron configuration
electronVersion: 31.2.0
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
