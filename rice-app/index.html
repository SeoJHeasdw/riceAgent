<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RICE - Runtime-Integrated Conversational Environment</title>
    <meta name="description" content="RICE is a desktop application for interacting with AI agents powered by MCP tools and plugins." />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    >

    <style>
      /* Prevent flash of unstyled content */
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0c0e13;
        color: #f0f3f8;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      
      /* Loading spinner */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #0c0e13;
      }
      
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #242a34;
        border-top-color: #4589ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
