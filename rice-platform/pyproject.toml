[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rice-platform"
version = "0.1.0"
description = "RICE Platform — Skill & Plugin Market API (RICE_PLATFORM_DESIGN.md)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
rice-platform = "rice_platform.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rice_platform"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
dev = "uvicorn rice_platform.app:app --reload --host 0.0.0.0 --port 7070"
